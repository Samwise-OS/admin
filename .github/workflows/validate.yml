name: Governance validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, observed 2026-10-27
        with:
          persist-credentials: false
      - name: Validate configuration and audit behavior
        run: |
          python3 scripts/audit.py validate
          python3 scripts/validate_safe_settings.py
          python3 -m unittest discover -s tests -v
